<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400"
     role="img" aria-labelledby="t d">
<title id="t">The master bus signal chain</title>
<desc id="d">Pads routed to Out 1 and 2, joined by the delay and reverb returns,
pass into the compressor, then the master EQ and filter, then a safety limiter,
then master volume, then out. The compressor and the EQ are the two stages this
patch gives you control of. The limiter is untouched.</desc>
<style>
  .bx  { fill: #F4F2ED; stroke: #D8D4CC; }
  .yrs { fill: #8C3A2E14; stroke: #8C3A2E; }
  .tx  { fill: #1A1815; font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sub { fill: #6E6A62; font: 400 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .acc { fill: #8C3A2E; font: 700 11px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ln  { stroke: #6E6A62; stroke-width: 1.5; }
  .hd  { fill: #6E6A62; }
  @media (prefers-color-scheme: dark) {
    .bx  { fill: #1C1A17; stroke: #35322C; }
    .yrs { fill: #D98A7820; stroke: #D98A78; }
    .tx  { fill: #E8E4DC; } .sub { fill: #9A948A; }
    .acc { fill: #D98A78; } .ln { stroke: #9A948A; } .hd { fill: #9A948A; }
  }
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
  <path d="M0,0 L9,4.5 L0,9 z" class="hd"/></marker></defs>

<rect class="bx" x="40"  y="12" width="215" height="44"/>
<text class="tx" x="147" y="32" text-anchor="middle">pads routed to Out 1/2</text>
<text class="sub" x="147" y="48" text-anchor="middle">everything you play</text>

<rect class="bx" x="305" y="12" width="215" height="44"/>
<text class="tx" x="412" y="32" text-anchor="middle">delay and reverb</text>
<text class="sub" x="412" y="48" text-anchor="middle">returns</text>

<path class="ln" d="M147,56 v22 h133 v22" fill="none" marker-end="url(#a)"/>
<path class="ln" d="M412,56 v22 h-133"    fill="none"/>

<rect class="yrs" x="170" y="102" width="220" height="46" stroke-width="2"/>
<text class="tx"  x="280" y="122" text-anchor="middle">COMPRESSOR</text>
<text class="acc" x="280" y="139" text-anchor="middle">parameters on MIDI</text>

<path class="ln" d="M280,148 v24" fill="none" marker-end="url(#a)"/>
<rect class="yrs" x="170" y="176" width="220" height="46" stroke-width="2"/>
<text class="tx"  x="280" y="196" text-anchor="middle">EQ AND FILTER</text>
<text class="acc" x="280" y="213" text-anchor="middle">parameters on MIDI</text>

<path class="ln" d="M280,222 v26" fill="none" marker-end="url(#a)"/>
<rect class="bx" x="170" y="254" width="220" height="40"/>
<text class="tx"  x="280" y="272" text-anchor="middle">safety limiter</text>
<text class="sub" x="280" y="287" text-anchor="middle">no control of it</text>

<path class="ln" d="M280,294 v24" fill="none" marker-end="url(#a)"/>
<rect class="bx" x="170" y="324" width="220" height="34"/>
<text class="tx" x="280" y="346" text-anchor="middle">master volume</text>

<path class="ln" d="M280,358 v20" fill="none" marker-end="url(#a)"/>
<text class="tx" x="280" y="392" text-anchor="middle">Out 1/2</text>
</svg>
